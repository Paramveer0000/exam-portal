<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Trait-based section, reused for the profile pages whose traits are derived
     combinations rather than dimension_results rows (personality, learning
     style, EI in practice, communication/leadership, behaviour, wellbeing).
     Page numbering is handled by the @page counters, so this fragment no
     longer takes a page number. Lives in its own file (never rendered
     standalone) so ${section} isn't null when this template is processed
     top-to-bottom. -->
<div th:fragment="traitSection(title, subtitle, section)" class="section">
  <div class="section-head">
    <div class="eyebrow" th:text="${subtitle}">Profile</div>
    <h2 th:text="${title}">Section</h2>
  </div>

  <div class="card">
    <div th:each="t : ${section.traits}" class="dim">
      <table>
        <tr>
          <td class="nm" th:text="${t.name}">Trait</td>
          <td class="sc">
            <span th:text="${#numbers.formatDecimal(t.score, 1, 0)} + '%'">0%</span>
            <span class="pill" th:text="${t.band}">Band</span>
          </td>
        </tr>
      </table>
      <div class="bar-track"><div class="bar-fill" th:style="'width:' + ${t.score} + '%'"></div></div>
    </div>
  </div>

  <div class="card tint" style="margin-top:4mm;">
    <p style="margin:0;" th:text="${section.content.status}">Status text.</p>
  </div>

  <table class="two" style="margin-top:4mm;">
    <tr>
      <td>
        <div class="card">
          <h3 style="color:#1F6B5E;">What's Working</h3>
          <ul class="tight"><li th:each="s : ${section.content.strengths}" th:text="${s}">Strength</li></ul>
        </div>
      </td>
      <td>
        <div class="card">
          <h3 style="color:#8A5A1D;">Watch For</h3>
          <ul class="tight"><li th:each="c : ${section.content.challenges}" th:text="${c}">Challenge</li></ul>
        </div>
      </td>
    </tr>
  </table>

  <div class="card" style="margin-top:4mm;">
    <h3>What Helps</h3>
    <ul class="tight"><li th:each="s : ${section.content.suggestions}" th:text="${s}">Suggestion</li></ul>
  </div>
</div>

</body>
</html>
