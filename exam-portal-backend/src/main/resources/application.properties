spring.application.name=exam-portal-app
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exam-portal?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@}

# JWT signing secret. Override with the JWT_SECRET environment variable in any
# real deployment; the default below exists only for local development.
jwt.secret=${JWT_SECRET:exam-portal-dev-secret-change-me}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
# Flyway now owns the schema; Hibernate only validates that entities match it.
spring.jpa.hibernate.ddl-auto = validate

spring.jpa.properties.hibernate.show_sql=true

# Return the reason phrase (e.g. duplicate-name messages) in error responses.
server.error.include-message=always

# --- Flyway ---
spring.flyway.enabled=true
# Existing databases created previously by ddl-auto=update have no Flyway history.
# baseline-on-migrate stamps them at V1 (so V1 is skipped) and applies V2+ on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- First Super Admin seed (created on startup if absent) ---
# Set SUPERADMIN_PASSWORD in the environment to enable seeding. If left blank,
# seeding is skipped with a warning (no default password is shipped).
superadmin.username=${SUPERADMIN_USERNAME:superadmin}
superadmin.password=${SUPERADMIN_PASSWORD:}
superadmin.first-name=${SUPERADMIN_FIRST_NAME:Super}
superadmin.last-name=${SUPERADMIN_LAST_NAME:Admin}
superadmin.phone-number=${SUPERADMIN_PHONE:0000000000}
