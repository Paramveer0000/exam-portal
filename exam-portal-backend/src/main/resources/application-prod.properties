# ==========================================================================
# Production profile.  Activate with SPRING_PROFILES_ACTIVE=prod.
# Inherits application.properties; overrides below tighten it for production.
#
# Secrets have NO fallback defaults here on purpose: if the environment does
# not supply them, placeholder resolution fails and the app refuses to start
# (fail fast) rather than booting with an insecure default.
# ==========================================================================

# --- Secrets: required, no defaults (fail fast if unset) ------------------
jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}

# --- Cookies: MUST be Secure (HTTPS-only) — defaults to true, so a missing
# COOKIE_SECURE env var still fails safe instead of silently going insecure.
cookie.secure=${COOKIE_SECURE:true}

# --- Disable development conveniences -------------------------------------
# Never log SQL (noise + potential PII exposure) in production.
spring.jpa.properties.hibernate.show_sql=false
# Do not expose exception messages by default; ResponseStatusException still
# returns its own message, but generic errors stay opaque.
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Logging levels -------------------------------------------------------
logging.level.root=INFO
logging.level.com.project.examportalbackend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# --- Reverse proxy trust (nginx/Dockploy sit in front) ---------------------
# Trust X-Forwarded-* from the upstream proxy so scheme/host are read
# correctly (HTTPS readiness), which also makes the Secure-cookie flag work.
server.forward-headers-strategy=framework
