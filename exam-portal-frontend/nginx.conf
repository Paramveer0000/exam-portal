# Serves the CRA static bundle and reverse-proxies /api to the backend.
# The "backend" host resolves to the backend service on the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted build assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + health proxied to the backend container.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://backend:8081/health;
    }

    # SPA client-side routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
