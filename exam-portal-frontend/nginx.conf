# Serves the CRA static bundle and reverse-proxies /api to the backend.
# The "backend" host resolves to the backend service on the compose network.
#
# TLS is terminated upstream (Dockploy's built-in proxy / Traefik / an
# external nginx) — this container only ever speaks plain HTTP on the
# compose network, so it does not redirect HTTP->HTTPS itself. It still
# adds an HSTS header when the upstream tells it the original request was
# HTTPS, for defense-in-depth if ever exposed directly.
map $http_x_forwarded_proto $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Empty when not HTTPS upstream — nginx omits an add_header whose value is empty.
    add_header Strict-Transport-Security $hsts_header always;

    # Long-cache fingerprinted build assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + health proxied to the backend container.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://backend:8081/health;
    }

    # SPA client-side routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
